[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-assistant-bot"
version = "0.1.0"
description = "Telegram bot for creating Jira issues from text messages"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24,<1",
    "python-dotenv>=1,<2",
    "python-telegram-bot>=21,<23",
]

[project.scripts]
jira-assistant-bot = "jira_assistant_bot.__main__:main"
jira-assistant-discover = "jira_assistant_bot.discover:main"

[tool.setuptools.packages.find]
where = ["src"]
